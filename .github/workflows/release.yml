# Deployments are manual via deploy-release.yml — no auto-deploy on push

name: "Release — Build Artifact & Publish GitHub Release"

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  VERSION: "1.0.${{ github.run_number }}"

jobs:
  build-and-release:
    runs-on: [self-hosted, build]
    steps:
      - name: Sparse-checkout .github
        uses: actions/checkout@v4
        with:
          sparse-checkout: ".github"
          sparse-checkout-cone-mode: false

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: Bullfrog.RMSAPI

      - name: Link shared deps
        id: link-deps
        uses: ./.github/actions/link-shared-deps
        with:
          bullfrog-token: ${{ secrets.BULLFROG_REPO_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet restore
        run: dotnet restore Bullfrog.RMSAPI/Bullfrog.RMSAPI.sln

      - name: dotnet build
        run: dotnet build Bullfrog.RMSAPI/Bullfrog.RMSAPI.sln -c Release --no-restore

      - name: dotnet publish
        run: dotnet publish Bullfrog.RMSAPI/Bullfrog.RMSAPI/Bullfrog.RMSAPI.csproj -c Release --no-build -o publish_output

      - name: Strip env-managed DLLs
        shell: pwsh
        run: |
          $dll = Join-Path "publish_output" "ThirdParty.Dummy.dll"
          [System.IO.File]::Delete($dll)
          if ([System.IO.File]::Exists($dll)) { throw "Failed to strip ThirdParty.Dummy.dll" }
          Write-Host "Stripped ThirdParty.Dummy.dll"

      - name: Write version.json
        shell: pwsh
        run: |
          $v = @{ version = "${{ env.VERSION }}"; "rmsapi-sha" = "${{ github.sha }}"; "bullfrog-sha" = "${{ steps.link-deps.outputs.bullfrog-sha }}"; "run-number" = "${{ github.run_number }}"; branch = "${{ github.ref_name }}" }
          $v | ConvertTo-Json | Set-Content publish_output/version.json

      - name: Create zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish_output/* -DestinationPath "Bullfrog.RMSAPI-v${{ env.VERSION }}.zip" -Force

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.VERSION }}" "Bullfrog.RMSAPI-v${{ env.VERSION }}.zip" `
            --repo qumbarraza/Bullfrog.RMSAPI `
            --title "Release v${{ env.VERSION }}" `
            --notes "## Release v${{ env.VERSION }}

          ### Promotion Checklist
          - [ ] Deploy to vm-dev

          ### Artifact Info
          - **Version:** ${{ env.VERSION }}
          - **Branch:** ${{ github.ref_name }}
          - **Run Number:** ${{ github.run_number }}
          - **rmsapi-sha:** ${{ github.sha }}
          - **bullfrog-sha:** ${{ steps.link-deps.outputs.bullfrog-sha }}"
